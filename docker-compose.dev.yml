services:
  mongodb:
    ports:
      - "27017:27017"

  backend:
    build:
      target: deps
    command: ["node", "--watch", "app.js"]
    environment:
      NODE_ENV: development
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    healthcheck:
      disable: true

  frontend:
    build:
      target: deps
    working_dir: /app
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    environment:
      VITE_API_URL: /api
      VITE_DEV_PROXY_TARGET: http://backend:3000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      disable: true

volumes:
  backend_node_modules:
  frontend_node_modules:
